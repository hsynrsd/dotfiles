"$schema" = 'https://starship.rs/config-schema.json'

# "Steel" prompt: dark blue-gray blocks fading darker, muted blue/teal text. No bright colors.
format = """
[╭─](dim)\
[](b1)\
$os\
$username\
[](bg:b2 fg:b1)\
$directory\
[](bg:b3 fg:b2)\
$git_branch\
$git_status\
[](bg:b4 fg:b3)\
$python\
$nodejs\
$rust\
$golang\
$docker_context\
[](bg:b5 fg:b4)\
$time\
[](fg:b5)\
$line_break\
[╰─](dim)$character"""
right_format = "$cmd_duration$status$jobs"
palette = 'mocha'
add_newline = true

[palettes.mocha]
# block backgrounds, lightest → darkest (dark steel blues)
b1 = '#3b4261'
b2 = '#2f354d'
b3 = '#262b3f'
b4 = '#1d2132'
b5 = '#171a28'
# text
blue = '#7aa2f7'
teal = '#73b8c9'
steel = '#a9b1d6'
dim = '#565f89'
red = '#e06c75'
amber = '#d8a657'

[os]
disabled = false
style = 'bg:b1 fg:blue'
format = '[$symbol]($style)'
[os.symbols]
Fedora = '󰣛 '
Linux = ' '

[username]
show_always = true
style_user = 'bold bg:b1 fg:steel'
style_root = 'bold bg:b1 fg:red'
format = '[$user ]($style)'

[directory]
style = 'bold bg:b2 fg:blue'
read_only = ' 󰌾'
read_only_style = 'bg:b2 fg:red'
truncation_length = 3
truncate_to_repo = false
truncation_symbol = '…/'
home_symbol = ' ~'
format = '[ $path$read_only ]($style)'
[directory.substitutions]
'Documents' = '󰈙 Documents'
'Downloads' = ' Downloads'
'Pictures' = ' Pictures'
'Music' = '󰝚 Music'

[git_branch]
symbol = ''
style = 'bg:b3 fg:teal'
format = '[ $symbol $branch ]($style)'

[git_status]
style = 'bg:b3 fg:amber'
format = '[($all_status$ahead_behind )]($style)'

[python]
symbol = ''
style = 'bg:b4 fg:steel'
format = '[ $symbol( $version)( \($virtualenv\)) ]($style)'

[nodejs]
symbol = ''
style = 'bg:b4 fg:steel'
format = '[ $symbol( $version) ]($style)'

[rust]
symbol = ''
style = 'bg:b4 fg:steel'
format = '[ $symbol( $version) ]($style)'

[golang]
symbol = ''
style = 'bg:b4 fg:steel'
format = '[ $symbol( $version) ]($style)'

[docker_context]
symbol = ''
style = 'bg:b4 fg:steel'
format = '[ $symbol( $context) ]($style)'

[time]
disabled = false
time_format = '%R'
style = 'bg:b5 fg:dim'
format = '[  $time ]($style)'

[line_break]
disabled = false

[character]
success_symbol = '[❯](bold blue)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[❮](bold teal)'

[cmd_duration]
min_time = 2000
style = 'fg:amber'
format = '[󱦟 $duration ]($style)'

[status]
disabled = false
symbol = '✘ '
style = 'bold fg:red'
format = '[$symbol$status ]($style)'

[jobs]
symbol = '󰜎 '
style = 'fg:teal'
format = '[$symbol$number ]($style)'
